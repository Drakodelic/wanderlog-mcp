name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm audit signatures
      - name: Prepare temporary formatted source diagnostics
        run: |
          npm run format
          for file in src/server.ts src/tools/check-conflicts.ts src/tools/optimize-day.ts src/tools/planning-helpers.ts tests/unit/planning-helpers.test.ts; do
            printf 'FORMATTED_START:%s:' "$file"
            base64 -w0 "$file"
            printf ':FORMATTED_END\n'
          done
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test -- --coverage
      - name: Coveralls
        if: matrix.node-version == 22
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: false
